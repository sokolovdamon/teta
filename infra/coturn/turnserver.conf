# TURN/STUN for TetaMeet: clients behind NAT relay media through this server.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# Must match MEET_TURN_SECRET in backend .env; credentials are issued per user by /api/v1/meet/ice-servers.
static-auth-secret=change-me
realm=teta.su
total-quota=300
stale-nonce=600
no-multicast-peers
no-cli
min-port=49160
max-port=49200
