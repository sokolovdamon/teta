# TETA platform. `docker compose up -d` brings up the full stack on one VDS.
# Profiles: `dev` adds Mailpit; `mail` adds the own Postfix server; `ai` adds a local LLM for bot German.
x-backend: &backend
  build: { context: ., dockerfile: infra/docker/backend.Dockerfile, target: app }
  image: teta/backend:latest
  env_file: backend/.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: reverb
  depends_on: [postgres, redis]
  volumes:
    - storage:/var/www/backend/storage/app
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: teta
      POSTGRES_USER: teta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teta}
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  backend:
    <<: *backend

  # Queues: payments and webhooks first, then domain events, letters and background work.
  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=payments,webhooks,payouts,outbox,mail-transactional,meet,default,mailing,mail-events,exports,content,files", "--tries=3", "--max-time=3600"]
    deploy: { replicas: 2 }

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-change-me}
        NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:-localhost}
    environment:
      BACKEND_INTERNAL_URL: http://nginx
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - storage:/var/www/backend/public/storage:ro
    depends_on: [backend, frontend, reverb]
    restart: unless-stopped

  # S3-compatible file storage on the project's own servers in the RF (diplomas, attachments, media).
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teta}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes: [files:/data]
    restart: unless-stopped

  # Daily PostgreSQL backup, kept for at least 7 days (TZ v2, section 8).
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGUSER: teta
      PGPASSWORD: ${POSTGRES_PASSWORD:-teta}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - ./infra/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on: [postgres]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes: [./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports: ["8025:8025", "1025:1025"]

  postfix:
    image: boky/postfix:latest
    profiles: [mail]
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-teta.su}
      DKIM_AUTOGENERATE: "true"
    volumes: [dkim:/etc/opendkim/keys]
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  pgdata: {}
  files: {}
  backups: {}
  redisdata: {}
  storage: {}
  dkim: {}
  ollama: {}
